<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FTS favicon lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon-package/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-package/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-package/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-package/apple-touch-icon.png">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <div class="brand">FTS favicon test</div>

      <nav class="switch" aria-label="Variants">
        <a class="active" href="index.html">Overview</a>
        <a href="square.html"><span class="dot"></span>Square</a>
        <a href="rounded.html"><span class="dot rounded"></span>Rounded</a>
        <a href="circle.html"><span class="dot circle"></span>Circle</a>
        <a href="transparent.html"><span class="dot ring"></span>Transparent</a>
      </nav>

      <section class="overview">
        <a href="square.html">
          <span class="thumb"><img src="favicon-package/favicon-512x512.png" alt=""></span>
          <span class="label">Square</span>
          <span class="meta">01</span>
        </a>
        <a href="rounded.html">
          <span class="thumb"><img src="favicon-rounded-package/favicon-512x512.png" alt=""></span>
          <span class="label">Rounded</span>
          <span class="meta">02</span>
        </a>
        <a href="circle.html">
          <span class="thumb"><img src="favicon-circle-package/favicon-512x512.png" alt=""></span>
          <span class="label">Circle</span>
          <span class="meta">03</span>
        </a>
        <a href="transparent.html">
          <span class="thumb"><img src="favicon-transparent-package/favicon-512x512.png" alt=""></span>
          <span class="label">Transparent</span>
          <span class="meta">04</span>
        </a>
      </section>

      <div class="caption">
        <code>open any variant to switch the tab favicon</code>
      </div>
    </main>
  </body>
</html>

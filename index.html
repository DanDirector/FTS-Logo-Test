<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FTS favicon tests</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon-package/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-package/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-package/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-package/apple-touch-icon.png">
    <link rel="manifest" href="favicon-package/site.webmanifest">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="FTS favicon tests">
          <span class="brand-mark"><img src="favicon-package/favicon-192x192.png" alt=""></span>
          <span>FTS Logo</span>
        </a>
        <nav class="simple-nav" aria-label="Pages">
          <a href="square.html">Square</a>
          <a href="circle.html">Circle</a>
          <a href="transparent.html">Transparent</a>
        </nav>
      </header>

      <section class="intro tile grey">
        <div>
          <p class="eyebrow">Favicon preview</p>
          <h1>Choose a favicon variant.</h1>
          <p>Open any card to switch to the page that uses that favicon in the browser tab.</p>
        </div>
      </section>

      <section class="variant-grid" aria-label="Favicon variants">
        <a class="tile dark variant-card" href="square.html">
          <div class="tile-label">Square</div>
          <div class="icon-stage plain">
            <img src="favicon-package/favicon-512x512.png" alt="Square FTS icon">
          </div>
          <p>Black square with the gold F mark.</p>
        </a>

        <a class="tile tan variant-card" href="circle.html">
          <div class="tile-label">Circle</div>
          <div class="icon-stage">
            <img src="favicon-circle-package/favicon-512x512.png" alt="Circle FTS icon">
          </div>
          <p>Black circle with transparent corners.</p>
        </a>

        <a class="tile darker variant-card" href="transparent.html">
          <div class="tile-label">Transparent</div>
          <div class="icon-stage">
            <img src="favicon-transparent-package/favicon-512x512.png" alt="Transparent FTS icon">
          </div>
          <p>Only the gold F mark, no background.</p>
        </a>
      </section>
    </main>
  </body>
</html>

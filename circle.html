<!doctype html>
<html lang="ru">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Circle favicon</title>
    <link rel="icon" href="favicon-circle-package/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-circle-package/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-circle-package/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-circle-package/apple-touch-icon.png">
    <link rel="manifest" href="favicon-circle-package/site.webmanifest">

    <main class="shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="FTS favicon tests">

        </a>
        <nav class="nav" aria-label="Pages">
          <a href="index.html">All Variants</a>

          <a href="circle.html" aria-current="page">Circle</a>
          <a href="transparent.html">Transparent</a>
        </nav>
      </header>

      <section class="detail">
        <div class="icon-stage">
          <img src="favicon-circle-package/favicon-512x512.png" alt="Circle FTS icon">
        </div>
        <div>
          <p class="eyebrow">Variant 2</p>
          <h1>Test page with the circle favicon.</h1>
          <p class="lead">The browser tab should now show a black circle with the gold F mark inside.</p>
          <div class="path-list">
            <span>Folder: <code>favicon-circle-package</code></span>

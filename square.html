<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Square favicon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon-package/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-package/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-package/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-package/apple-touch-icon.png">
    <link rel="manifest" href="favicon-package/site.webmanifest">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="msapplication-config" content="favicon-package/browserconfig.xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="FTS favicon tests">
          <span class="brand-mark"><img src="favicon-package/favicon-192x192.png" alt=""></span>
          <span>FTS Logo</span>
        </a>
        <nav class="simple-nav" aria-label="Pages">
          <a href="index.html">All variants</a>
          <a href="circle.html">Circle</a>
          <a href="transparent.html">Transparent</a>
        </nav>
      </header>

      <section class="detail-layout">
        <div class="tile dark detail-preview">
          <div class="tile-label">Square favicon</div>
          <div class="icon-stage plain">
            <img src="favicon-package/favicon-512x512.png" alt="Square FTS icon">
          </div>
        </div>
        <div class="tile grey detail-copy">
          <p class="eyebrow">Variant 01</p>
          <h1>Square favicon</h1>
          <p>The browser tab should now show a black square icon with the gold F mark.</p>
        </div>
      </section>
    </main>
  </body>
</html>

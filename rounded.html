<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon-rounded-package/favicon.ico" sizes="any">

      <nav class="switch" aria-label="Variants">

        <a class="active" href="rounded.html"><span class="dot rounded"></span>Rounded</a>

        <a href="transparent.html"><span class="dot ring"></span>Transparent</a>

      <div class="stage"><img src="favicon-rounded-package/favicon-512x512.png" alt="Rounded FTS icon"></div>

      <div class="caption">
        <h1>Rounded <em>favicon</em></h1>
